services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: studybuddydb
      POSTGRES_USER: ${DB_USERNAME:-studybuddy}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the project .env file}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: 8081
      DB_URL: jdbc:postgresql://db:5432/studybuddydb
      DB_USERNAME: ${DB_USERNAME:-studybuddy}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the project .env file}
    ports:
      - "8081:8081"

volumes:
  postgres_data:
