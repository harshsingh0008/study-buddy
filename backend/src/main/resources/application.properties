# ============================================
# Server Configuration
# ============================================
server.port=8081

# ============================================
# Database (PostgreSQL)
# ============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/studybuddy
spring.datasource.username=postgres
spring.datasource.password=1202
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ============================================
# Google OAuth2 Login
# ============================================
spring.security.oauth2.client.registration.google.client-id=990324920276-ehfm29go819fc2hh9vmls4lmdhh2fpmq.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8081/login/oauth2/code/google

# ============================================
# Python AI Service URL
# ============================================
ai.service.url=http://localhost:8000

