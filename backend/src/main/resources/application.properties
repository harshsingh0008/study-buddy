# ============================================
# Server Configuration
# ============================================
server.port=${PORT:8081}

# ============================================
# Frontend URL (for CORS & OAuth2 redirect)
# ============================================
app.frontend.url=${FRONTEND_URL:/}

# ============================================
# Database (PostgreSQL)
# ============================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/studybuddydb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect  # auto-detected by Spring Boot 3.5
spring.jpa.open-in-view=false

# ============================================
# Google OAuth2 Login
# ============================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ============================================
# Google Gemini AI Service
# ============================================
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-1.5-flash}

# ============================================
# JWT Authentication Configuration
# ============================================
# Set JWT_SECRET to a unique random value of at least 32 characters.
jwt.secret=${JWT_SECRET:}
jwt.expiration-days=${JWT_EXPIRATION_DAYS:7}

# ============================================
# Email Configuration (SMTP)
# ============================================
spring.mail.host=${SMTP_HOST:${MAIL_HOST:smtp.gmail.com}}
spring.mail.port=${SMTP_PORT:${MAIL_PORT:587}}
spring.mail.username=${SMTP_USER:${MAIL_USERNAME:}}
spring.mail.password=${SMTP_PASS:${MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
