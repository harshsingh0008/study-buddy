# ============================================
# Server Configuration
# ============================================
server.port=8081

# ============================================
# Frontend URL (for CORS & OAuth2 redirect)
# ============================================
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# ============================================
# Database (PostgreSQL)
# ============================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/studybuddy}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1202}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ============================================
# Google OAuth2 Login
# ============================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:990324920276-ehfm29go819fc2hh9vmls4lmdhh2fpmq.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ============================================
# Python AI Service URL
# ============================================
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# ============================================
# Email Configuration (SMTP)
# ============================================
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
